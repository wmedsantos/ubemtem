name: Build Eleventy & Deploy Docs

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true    # necessário para o commit de volta

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy
        run: npm run build

      - name: Copy to docs
        run: |
          rm -rf docs
          mkdir docs
          cp -r _site/* docs/

      # --- Your Manual Push Steps (using PAT) ---
      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push changes
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/wmedsantos/ubemtem.git
          git add docs/
          git commit -m "Ci: rebuild site after source update" || echo "No changes to commit"
          git push origin HEAD:main

      # --- Or keep this auto-commit action if you prefer ---
      # - name: Commit and push updates
      #   uses: stefanzweifel/git-auto-commit-action@v4
      #   with:
      #     commit_message: "Ci: rebuild site after source update"
      #     file_pattern: docs/*
      #     branch: main
